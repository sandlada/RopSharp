name: Publish NuGet package

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version to publish'
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, test and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore Sandlada.RopSharp/Sandlada.RopSharp.csproj

      - name: Build
        run: dotnet build Sandlada.RopSharp/Sandlada.RopSharp.csproj -c Release --no-restore

      - name: Test
        run: dotnet test Sandlada.RopSharp.Tests/Sandlada.RopSharp.Tests.csproj -c Release

      - name: Pack
        run: |
          dotnet msbuild Sandlada.RopSharp/Sandlada.RopSharp.csproj \
            -t:Pack -p:Configuration=Release \
            ${{ inputs.version && format('-p:Version={0}', inputs.version) || '' }} \
            -p:PackageOutputPath="${{ github.workspace }}/artifacts"

      - name: List artifacts
        run: ls -la artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/*.snupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Upload package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: artifacts/*
