name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to publish (for example 1.2.3)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: pack and push
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install the SDK from global.json
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-quality: preview

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [ -z "$version" ]; then
            echo "A package version is required." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require NuGet API key
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          if [ -z "$NUGET_API_KEY" ]; then
            echo "The NUGET_API_KEY repository secret is not set." >&2
            exit 1
          fi

      - name: Restore (locked)
        run: dotnet restore --locked-mode

      - name: Format
        run: dotnet format RopSharp.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test
        run: dotnet test -c Release --no-build

      - name: Pack
        run: >
          dotnet pack Sandlada.RopSharp/Sandlada.RopSharp.csproj
          -c Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          -o artifacts/release

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            artifacts/release/*.nupkg
            artifacts/release/*.snupkg
          if-no-files-found: error

      - name: Publish to nuget.org
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          dotnet nuget push "artifacts/release/Sandlada.RopSharp.$version.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
          dotnet nuget push "artifacts/release/Sandlada.RopSharp.$version.snupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
